<!DOCTYPE html>
<html>
  <head>
    <title>Alkmini compiler</title>
    
    <meta name="viewport" content="width=device-width">
    
    <link rel="icon" href="../../icon.png">
    
    <link rel="stylesheet" href="../../style.css">
    
    <style>
      #compileStatusElem {
        margin-left: 0.5em;
      }
      #compileStatusElem:not(.error) {
        display: none;
      }
    </style>
  </head>
  
  <body>
    <div class="parentRef"><a href="../">Alkmini</a></div>
    
    
    <div class="verticalParts">
      <div>
        A compiler from Alkmini to <a href="../../kwert/">Kwert</a>.
      </div>
      
      <div>
        <label for="programInp">Program:</label>
        <br>
        <textarea id="programInp"></textarea>
        <br><br>
        <button id="compileButton">Compile</button>
        <span id="compileStatusElem"></span>
      </div>
      
      <div>
        Result:
        <br>
        <div id="resultElem" class="preciseTextBox"></div>
      </div>
    </div>
    
    
    <script src="alkmini-compiler.mjs" type="module"></script>
  </body>
</html>
