<!DOCTYPE html>
<html>
  <head>
    <title>Alkmini</title>
    
    <meta name="viewport" content="width=device-width">
    
    <link rel="icon" href="../icon.png">
    
    <link rel="stylesheet" href="../style.css">
    
    <style>
    
      #haltStatusElem {
        color: gray;
        margin-left: 1em;
      }
      
      #haltStatusElem:not(.halted) {
        display: none;
      }
    
      #dataElem {
        padding-top: 1em;
        padding-bottom: 1em;
      }
      
    </style>
  </head>
  
  <body>
    <div class="parentRef"><a href="../">Esolang stuff</a></div>
    
    
    <div class="verticalParts">
      <div>
        <p>
          An interpreter for <a href="https://esolangs.org/wiki/Alkmini">Alkmini</a>.
        </p>
        <p>
          See also: <a href="https://github.com/Arctenik/esolangs/tree/main/alkmini/programs">example programs</a>, <a href="./compiler">compiler</a> from Alkmini to Kwert
        </p>
      </div>
      
      <div>
        <label for="programInp">Program:</label>
        <br>
        <textarea id="programInp"></textarea>
        <br><br>
        <button id="initializeButton">Initialize</button>
      </div>
      
      <div>
        <label for="stepAmountInp">Step amount:</label> <input type="number" id="stepAmountInp" min="1" step="1" value="1">
        <button id="stepButton">Step</button>
        <span id="haltStatusElem">Halted</span>
        <br><br>
        Data:
        <br>
        <div id="dataElem" class="preciseTextBox"></div>
      </div>
    </div>
    
    
    <script src="./alkmini.mjs" type="module"></script>
  </body>
</html>
